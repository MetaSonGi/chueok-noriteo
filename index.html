<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>추억 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Gowun+Batang:wght@700&family=Do+Hyeon&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  --bg:#D6E0D2;--page-ink:#24302A;--panel-bg:#2F4A3B;--edge:#7A5A3A;--edge-sh:#5A4129;--ink:#EFEEE4;--dim:#B9C3B5;
  --accent:#E4B34A;--accent-ink:#2A2112;--accent-sh:#9C7623;--display:"Jua";
  margin:0;background:var(--bg);color:var(--page-ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  display:flex;justify-content:center;min-height:100%;-webkit-tap-highlight-color:transparent;transition:background .3s}
body[data-era=trad]{--bg:#E0D6C0;--page-ink:#2B2320;--panel-bg:#F4EEDF;--edge:#7B5234;--edge-sh:#55361F;--ink:#2B2320;--dim:#7A6656;--accent:#2E6E62;--accent-ink:#F4EEDF;--accent-sh:#1C463E;--display:"Gowun Batang"}
body[data-era=alley]{--bg:#C3C6C1;--page-ink:#26292B;--panel-bg:#2D5B7B;--edge:#7A4B2A;--edge-sh:#4F2F18;--ink:#F3F0E5;--dim:#B8CCD9;--accent:#EAC64A;--accent-ink:#2A230E;--accent-sh:#A88A22;--display:"Do Hyeon"}
body[data-era=school]{--bg:#D6E0D2;--page-ink:#24302A;--panel-bg:#2F4A3B;--edge:#7A5A3A;--edge-sh:#5A4129;--ink:#EFEEE4;--dim:#B9C3B5;--accent:#E4B34A;--accent-ink:#2A2112;--accent-sh:#9C7623;--display:"Jua"}
body[data-era=shop]{--bg:#D7E3F3;--page-ink:#1E2A44;--panel-bg:#1F5FC8;--edge:#E2382F;--edge-sh:#9E2019;--ink:#FFFFFF;--dim:#C9DBF8;--accent:#FFD23F;--accent-ink:#1E2A55;--accent-sh:#C49C10;--display:"Black Han Sans"}
body[data-era=y2k]{--bg:#E4E9F0;--page-ink:#1D2938;--panel-bg:linear-gradient(180deg,#E6ECF2,#BDC9D6);--edge:#8B98A8;--edge-sh:#66717F;--ink:#1D2938;--dim:#55606E;--accent:#1FB2E6;--accent-ink:#FFFFFF;--accent-sh:#1584AC;--display:"Jua"}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark}:root:not([data-theme=light]) body{--bg:#141A17;--page-ink:#E2E6E0}}
:root[data-theme=dark]{color-scheme:dark}:root[data-theme=dark] body{--bg:#141A17;--page-ink:#E2E6E0}
.wrap{width:100%;max-width:480px;padding:14px 14px 22px}
.panel{background:var(--panel-bg);border:6px solid var(--edge);border-radius:12px;color:var(--ink);padding:14px;box-shadow:0 3px 0 var(--edge-sh)}
.disp{font-family:var(--display),"Jua",sans-serif;font-weight:400}
h1,h2,h3{font-family:var(--display),"Jua",sans-serif;font-weight:400;margin:0}
body[data-era=trad] h1,body[data-era=trad] h2,body[data-era=trad] h3{font-weight:700}
.dim{color:var(--dim)}
p{line-height:1.6}
button{font:inherit;cursor:pointer;color:inherit}
.btn{font-family:var(--display),"Jua",sans-serif;font-size:1.3rem;width:100%;margin-top:12px;padding:13px;border:0;border-radius:10px;
  background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-sh)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-sh)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn.ghost:active{transform:translateY(1px)}
.row{display:flex;gap:8px}.row>.btn{flex:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;border-radius:999px;padding:7px 12px;background:rgba(127,127,127,.18);color:var(--ink);font-size:.95rem}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.tl{display:flex;margin:12px -14px 0;padding:0 14px 4px;overflow-x:auto;scrollbar-width:none}
.tl::-webkit-scrollbar{display:none}
.tl button{flex:0 0 auto;border:0;background:none;margin:0;padding:8px 11px 6px;color:var(--dim);font-family:var(--display),"Jua",sans-serif;
  font-size:1.02rem;text-align:left;border-top:2px solid color-mix(in srgb,var(--ink) 30%,transparent);position:relative}
.tl button::before{content:"";position:absolute;top:-6px;left:11px;width:10px;height:10px;border-radius:50%;background:var(--edge);border:2px solid color-mix(in srgb,var(--ink) 40%,transparent)}
.tl button small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:.72rem;margin-top:1px;opacity:.9}
.tl button[aria-selected=true]{color:var(--ink)}
.tl button[aria-selected=true]::before{background:var(--accent);border-color:var(--accent)}
.field{position:relative;margin-top:12px;border-radius:8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%}
.msg{position:absolute;left:0;right:0;top:36%;padding:0 16px;text-align:center;font-family:var(--display),"Jua",sans-serif;font-size:2rem;color:#fff;
  text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 14px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .25s}
.msg.show{opacity:1}
.msg small{display:block;font-family:"Gowun Dodum",sans-serif;font-size:1rem;margin-top:4px}
.meter{position:relative;height:14px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;margin-top:10px}
.meter i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ink)}
.meter b{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--accent)}
.meter-label{display:flex;justify-content:space-between;font-size:.8rem;color:var(--dim);margin-top:4px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px;font-size:.95rem}
.foot{font-size:.82rem;opacity:.75;text-align:center;margin-top:12px;line-height:1.5}
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.gbar .back{border:0;background:none;color:var(--page-ink);font-size:1rem;padding:8px 4px}
.gbar h2{font-size:1.5rem;color:var(--page-ink)}
/* hub */
.hub h1{font-size:2.6rem;line-height:1.1}
.hub .lede{margin:6px 0 0;color:var(--dim)}
.era-head{margin-top:14px}
.era-head h2{font-size:1.6rem}
.era-head p{margin:2px 0 0;color:var(--dim);font-size:.95rem}
.games{list-style:none;margin:10px 0 0;padding:0}
.games li{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px dashed color-mix(in srgb,var(--ink) 30%,transparent)}
.games li:first-child{border-top:0}
.games .t{flex:1;min-width:0}
.games .n{font-family:var(--display),"Jua",sans-serif;font-size:1.18rem}
body[data-era=trad] .games .n{font-weight:700}
.games .d{font-size:.88rem;color:var(--dim);line-height:1.45;margin-top:1px}
.games .tag{display:inline-block;font-family:"Gowun Dodum",sans-serif;font-size:.75rem;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);vertical-align:2px}
.games .go{flex:0 0 auto;border:0;border-radius:9px;padding:9px 14px;background:var(--accent);color:var(--accent-ink);font-family:var(--display),"Jua",sans-serif;font-size:1.05rem;box-shadow:0 3px 0 var(--accent-sh)}
.games .go:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-sh)}
.games .soon{flex:0 0 auto;font-size:.8rem;color:var(--dim)}
.games li.off .n{opacity:.7}
/* biseok */
.lives{margin-left:auto;display:flex;gap:5px}
.life{width:16px;height:10px;border-radius:50%;background:#A8A39A;box-shadow:inset 0 -2px 0 #6f6b64}
.life.gone{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim)}
.track{display:flex;gap:4px;margin-top:10px}
.track span{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ink) 18%,transparent)}
.track span.done{background:var(--ink)}.track span.now{background:var(--accent)}
/* ttakji */
.swatches{display:flex;gap:8px;margin-top:8px}
.sw{width:34px;height:34px;border-radius:6px;border:3px solid transparent;padding:0}
.sw[aria-pressed=true]{border-color:var(--ink)}
.stickers{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:8px}
.stickers button{border:0;border-radius:8px;background:rgba(127,127,127,.18);font-size:1.4rem;padding:6px 0}
.stickers button[aria-pressed=true]{background:var(--accent)}
.pad{background:#fff;border-radius:8px;touch-action:none;width:100%;max-width:220px;aspect-ratio:1;display:block;margin:8px auto 0}
input[type=text]{font:inherit;width:100%;padding:10px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);margin-top:6px}
.score{display:flex;align-items:center;justify-content:space-between;gap:8px}
.score .p{display:flex;align-items:center;gap:6px;font-family:var(--display),sans-serif;font-size:1.1rem}
.dots{display:flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink)}.dots i.on{background:var(--accent);border-color:var(--accent)}
.turn{text-align:center;margin-top:6px;color:var(--dim)}
.opt{display:block;width:100%;text-align:left;border:0;border-radius:10px;background:rgba(127,127,127,.16);color:var(--ink);padding:12px 14px;margin-top:10px}
.opt strong{display:block;font-family:var(--display),sans-serif;font-weight:400;font-size:1.25rem}
.opt span{font-size:.9rem;color:var(--dim)}
.lr{display:flex;gap:10px;margin-top:12px}.lr .btn{margin-top:0;padding:18px}
@media (prefers-reduced-motion:reduce){.msg,body{transition:none}}
</style>
</head>
<body data-era="trad">
<div class="wrap">
  <main id="hub" class="panel hub"></main>
  <section id="game" hidden>
    <div class="gbar"><button class="back" id="back">‹ 놀이 목록</button><h2 id="gtitle"></h2></div>
    <div id="stage"></div>
  </section>
</div>
<script>
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const gauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
let AC=null;
function ac(){ if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,dur,{type='sine',vol=.2,at=0,to=0}={}){
  const a=ac(); if(!a) return; const t=at||a.currentTime, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(to) o.frequency.exponentialRampToValueAtTime(to,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,{freq=1000,vol=.3,at=0,type='bandpass',q=1}={}){
  const a=ac(); if(!a) return; const t=at||a.currentTime;
  const b=a.createBuffer(1,Math.max(1,a.sampleRate*dur|0),a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const n=a.createBufferSource(); n.buffer=b; const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
  const g=a.createGain(); g.gain.value=vol; n.connect(f).connect(g).connect(a.destination); n.start(t);
}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function setupCanvas(cv,ratio){
  const ctx=cv.getContext('2d'), o={ctx,W:0,H:0};
  o.resize=()=>{const w=cv.parentElement.clientWidth, d=Math.min(devicePixelRatio||1,2); o.W=w; o.H=Math.round(w*ratio);
    cv.width=o.W*d; cv.height=o.H*d; cv.style.height=o.H+'px'; ctx.setTransform(d,0,0,d,0,0);};
  o.resize(); return o;
}
function ptr(e,cv){const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};}
function msgBox(el){return{show(t,s){el.innerHTML=t+(s?`<small>${s}</small>`:'');el.classList.add('show');},hide(){el.classList.remove('show');}};}
function kit(){
  const L=[]; let alive=true;
  return {
    on(t,e,f,o){t.addEventListener(e,f,o);L.push(()=>t.removeEventListener(e,f,o));},
    loop(fn){let last=performance.now();const step=n=>{if(!alive)return;const dt=Math.min(.05,(n-last)/1000);last=n;fn(dt);requestAnimationFrame(step);};requestAnimationFrame(step);},
    later(f,ms){const id=setTimeout(()=>alive&&f(),ms);L.push(()=>clearTimeout(id));return id;},
    every(f,ms){const id=setInterval(()=>alive&&f(),ms);L.push(()=>clearInterval(id));return id;},
    get alive(){return alive;},
    cleanup(){alive=false;L.forEach(f=>f());}
  };
}

const HUB=[
 {id:'trad',tab:'전통',years:'1960년대 이전',name:'전통 놀이',line:'마당과 들판에서 대대로 이어진 놀이',games:[

  ['비석치기','돌을 던지거나 몸에 얹어 상대 돌 쓰러뜨리기','biseok','배경 6시대'],
  ['공기놀이','작은 돌을 던지고 받기'],['자치기','짧은 나무막대를 쳐서 멀리 보내기'],['고누놀이','판 위의 말을 움직여 상대를 막는 놀이']]},
 {id:'alley',tab:'60·70년대',years:'1960~1970년대',name:'골목 놀이',line:'해 질 때까지 골목에서',games:[
  ['딱지치기','내 딱지를 만들어 친구나 고수와 겨루기','ttakji','친구 대전'],['구슬치기','구슬을 맞히거나 구멍에 넣기'],
  ['땅따먹기','돌을 튕겨 자기 영역 넓히기'],['사방치기','땅에 그린 칸을 한 발로 뛰어 이동하기'],['고무줄놀이','노래에 맞춰 고무줄 넘기'],
  ['말뚝박기','엎드린 상대 팀 등에 올라타기'],['술래잡기','도망가는 친구를 술래가 잡기'],['숨바꼭질','숨은 친구를 찾아내기'],
  ['오징어놀이','오징어 모양 경기장에서 공격·수비하기'],['깡통차기','숨바꼭질에 깡통 차기를 결합한 놀이']]},
 {id:'school',tab:'80년대',years:'1980년대',name:'골목·학교 앞 놀이',line:'학교 끝나면 문방구 앞으로',games:[
  ['달고나 뽑기','손가락으로 선을 따라 긁어 모양 떼어내기','dalgona','터치'],['무궁화꽃이 피었습니다','술래가 돌아보기 전에 움직이기'],
  ['얼음땡','잡히면 멈추고 친구가 풀어주는 술래잡기'],['다방구','잡힌 친구를 구출하는 팀 술래잡기'],
  ['실뜨기','손가락에 실을 걸어 모양 이어 만들기','sil','8가지 모양'],['그림자밟기','상대의 그림자를 밟아 잡기'],
  ['꼬리잡기','줄지어 선 상대 팀의 맨 뒤 사람 잡기'],['수건돌리기','원 밖에서 수건을 놓고 달리기'],
  ['우리 집에 왜 왔니','노래와 가위바위보로 상대 팀 데려오기'],['대문놀이','노래에 맞춰 팔로 만든 문 통과하기']]},
 {id:'shop',tab:'90년대',years:'1990년대',name:'운동장·문방구 놀이',line:'문방구 앞 오락기 옆에서',games:[
  ['경찰과 도둑','두 팀으로 나눠 추격하고 탈출하기'],['탈출놀이','정글짐 등 정해진 구역에서 술래 피하기'],['피구','공으로 상대를 맞혀 아웃시키기'],
  ['발야구','공을 발로 차고 베이스 돌기'],['긴 줄넘기','여러 명이 함께 줄을 넘기'],['고무딱지치기','고무딱지를 던져 뒤집거나 맞히기'],
  ['종이 따먹기','접은 종이를 입김 등으로 뒤집기'],['지우개 따먹기','책상 위에서 지우개로 상대 지우개 밀어내기'],
  ['미니카 경주','조립한 미니카를 트랙에서 달리기'],['손바닥 뒤집기','상대 손등을 치고 피하며 반응 겨루기']]},
 {id:'y2k',tab:'2000년대',years:'2000년대',name:'학교·방과 후 놀이',line:'쉬는 시간 10분의 승부',games:[
  ['팽이 대결','발사한 팽이끼리 겨루기'],['캐릭터 딱지놀이','캐릭터 딱지로 뒤집기·맞히기'],['공깃돌 단계 겨루기','단계별 공기놀이와 꺾기로 승부하기'],
  ['손축구','책상 위에서 작은 공을 손가락으로 튕기기'],['종이축구','접은 종이를 튕겨 골 넣기'],['종이비행기 대회','멀리 날리기·오래 날리기 겨루기'],
  ['펜 돌리기','손가락으로 펜을 돌리며 기술 겨루기'],['손가락 씨름','엄지손가락으로 상대 엄지 누르기'],['눈싸움','먼저 눈을 깜빡이거나 웃으면 지기'],
  ['묵찌빠','가위바위보로 공격권을 정해 손 모양 맞히기']]},

const GAMES={};
let hubEra=Math.max(0,HUB.findIndex(e=>e.id===store.get('hub-era')));
function renderHub(){
  const E=HUB[hubEra], n=E.games.filter(g=>g[2]).length;
  document.getElementById('hub').innerHTML=`
    <h1>추억 놀이터</h1>

function yarn(a,b,alpha,width,sag=1){ const A=pegPos(a),B=pegPos(b), mx=(A.x+B.x)/2, my=(A.y+B.y)/2+Math.hypot(B.x-A.x,B.y-A.y)*.04*sag;
  ctx.strokeStyle=`rgba(200,50,58,${alpha})`; ctx.lineWidth=width; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.quadraticCurveTo(mx,my,B.x,B.y); ctx.stroke(); }
K.loop(dt=>{
  const W=C.W,H=C.H, f=FIG[S.fig];
  if(S.phase==='play'){ S.t+=dt; if(S.hidden) S.show=Math.max(0,1-Math.max(0,S.t-2.2)/.6);
    $('time').style.width=Math.max(0,1-S.t/S.limit)*100+'%'; if(S.t>=S.limit){ S.lives--; hud(); if(S.lives<=0) over('시간이 다 됐어요'); else { M.show('시간 초과',`남은 실 ${S.lives}타래`); S.phase='done'; S.score=Math.max(0,S.score); btn.disabled=false; btn.textContent='이 모양 다시'; S.retry=true; } } }
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(120,90,50,.06)'; for(let y=0;y<H;y+=6) ctx.fillRect(0,y,W,2);
  // 손
  ctx.fillStyle='#E9C3A0'; ctx.strokeStyle='#C99A74'; ctx.lineWidth=1.5;
  [[-1,.14],[1,.86]].forEach(([side,u])=>{ const x=W*u; ctx.beginPath(); ctx.roundRect?ctx.roundRect(side<0?0:x,H*.1,side<0?x:W-x,H*.8,14):ctx.rect(side<0?0:x,H*.1,side<0?x:W-x,H*.8); ctx.globalAlpha=.55; ctx.fill(); ctx.globalAlpha=1; });
  // 목표 모양
  const showA=S.phase==='ready'?0:(S.phase==='play'?S.show:1)*.35;
  if(showA>0){ ctx.setLineDash([6,7]); f.e.forEach(([a,b])=>{ if(!S.placed.has(key(a,b))) yarn(a,b,showA,3); }); ctx.setLineDash([]); }
  f.e.forEach(([a,b])=>{ if(S.placed.has(key(a,b))||S.phase==='done'||S.phase==='win') yarn(a,b,1,5,1.4); });
  if(S.tangle&&S.tangle.t>0){ S.tangle.t-=dt*1.5; const A=pegPos(S.tangle.a),B=pegPos(S.tangle.b); ctx.strokeStyle=`rgba(90,90,90,${S.tangle.t})`; ctx.lineWidth=3; ctx.beginPath();
    for(let i=0;i<=20;i++){const t=i/20, x=A.x+(B.x-A.x)*t+Math.sin(t*30)*8, y=A.y+(B.y-A.y)*t+Math.cos(t*27)*8; i?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); }
  if(S.flash>0) S.flash-=dt;
  // 손가락 끝
  for(let i=0;i<12;i++){ const p=pegPos(i), r=W*.045, sel=S.sel===i;
    if(i>=10&&!f.e.some(e=>e.includes(i))&&S.phase!=='ready'){ ctx.globalAlpha=.25; }
    ctx.fillStyle=sel?'#E4B34A':'#F2D2B3'; ctx.strokeStyle=sel?'#9C7623':'#B9875F'; ctx.lineWidth=sel?3:1.5;
    ctx.beginPath(); ctx.ellipse(p.x,p.y,r,r*.82,0,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,240,230,.9)'; ctx.beginPath(); ctx.ellipse(p.x+(i<5?-r*.25:i<10?r*.25:0),p.y-r*.15,r*.42,r*.32,0,0,7); ctx.fill();
    ctx.fillStyle='#6B4A33'; ctx.font=`${Math.round(W*.028)}px "Gowun Dodum",sans-serif`; ctx.textAlign='center';
    ctx.fillText(i<10?FINGER[i%5]:'친구',p.x,p.y+r+W*.03); ctx.globalAlpha=1; }
});
hud();
}};
GAMES.paengi={title:'팽이치기',era:'trad',mount(root,K){
root.innerHTML=`<div class="panel">
  <div class="stat" style="margin-top:0"><h3 id="sec" style="font-size:1.3rem">얼음판 장단치기</h3><span>점수 <b id="score">0</b></span></div>
  <div class="meter"><i id="spin" style="background:var(--accent)"></i></div>
  <div class="meter-label"><span>팽이 힘</span><span id="combo"></span><span id="best"></span></div>
  <div class="field" id="field"><canvas id="cv"></canvas><div class="msg" id="msg"></div></div>
  <div class="lr"><button class="btn" id="L">왼쪽 채</button><button class="btn" id="R">오른쪽 채</button></div>
  <button class="btn ghost" id="start">장단 시작</button></div>
  <p class="foot">구슬이 가운데 고리에 닿을 때 그쪽 채를 쳐요.<br>화면 왼쪽·오른쪽을 눌러도 되고, 키보드 F·J나 ←·→도 돼요.</p>`;
const $=id=>root.querySelector('#'+id), M=msgBox($('msg')), cv=$('cv');
const C=setupCanvas(cv,1.05), ctx=C.ctx; K.on(window,'resize',()=>C.resize());
const PAT={
 a:[[0,'L'],[6,'R']],
 b:[[0,'L'],[3,'R'],[6,'L'],[9,'R']],
 c:[[0,'L'],[3,'L'],[6,'R'],[8,'L'],[9,'R']],
 d:[[0,'L'],[2,'R'],[3,'L'],[6,'R'],[8,'R'],[9,'L'],[11,'R']],
 e:[[0,'L'],[1,'R'],[3,'L'],[6,'R'],[7,'L'],[9,'R'],[10,'L']],
};
const SONG=[
 {bpm:66,name:'중모리처럼 느리게',bars:'aabbbb'},
 {bpm:80,name:'자진모리',bars:'cccdcd'},
 {bpm:96,name:'휘모리',bars:'ddeded'},
 {bpm:108,name:'몰아치기',bars:'eeeb'},
];
function build(){ const notes=[], beats=[]; let t=0;
  SONG.forEach((s,si)=>{ const sub=60/s.bpm/3; for(const ch of s.bars){ for(let k=0;k<12;k+=3) beats.push({t:t+k*sub,down:k===0,si});
    PAT[ch].forEach(([p,lane])=>notes.push({t:t+p*sub,lane,hit:null,si})); t+=12*sub; } });
  return {notes,beats,len:t}; }
let S={phase:'ready',spin:60,score:0,combo:0,maxCombo:0,judg:null,ang:0,whip:{L:0,R:0},t0:0,chart:null,schedI:0,fallA:0,perfect:0,good:0,miss:0};
const now=()=>{const a=AC; return a?a.currentTime:performance.now()/1000;};
const TRAVEL=1.3, PERF=.07, GOOD=.14;
function start(){ const a=ac(); S={phase:'play',spin:60,score:0,combo:0,maxCombo:0,judg:null,ang:0,whip:{L:0,R:0},chart:build(),schedI:0,fallA:0,perfect:0,good:0,miss:0,secI:-1};
  S.t0=now()+2; M.show('준비','셋, 둘, 하나…'); K.later(()=>M.hide(),1800); $('start').hidden=true; }
function hud(){ $('score').textContent=S.score; $('spin').style.width=clamp(S.spin,0,100)+'%';
  $('combo').textContent=S.combo>2?`${S.combo} 연속`:''; const b=+store.get('paengi-best')||0; $('best').textContent=b?`최고 ${b}`:''; }
function janggu(t,down){ if(!AC) return; if(down){ tone(95,.25,{vol:.35,at:t,to:60}); noise(.06,{freq:300,vol:.2,at:t,type:'lowpass'}); } else tone(1200,.04,{type:'triangle',vol:.05,at:t}); }
function hit(lane){
  if(S.phase!=='play') return; ac(); const t=now()-S.t0; S.whip[lane]=1;
  let best=null,bd=1; for(const n of S.chart.notes){ if(n.hit!==null||n.lane!==lane) continue; const d=Math.abs(n.t-t); if(d<bd){bd=d;best=n;} if(n.t-t>GOOD) break; }
  if(best&&bd<=GOOD){ const perf=bd<=PERF; best.hit=perf?2:1; S.combo++; S.maxCombo=Math.max(S.maxCombo,S.combo);
    S.score+=(perf?100:50)+Math.min(50,S.combo*2); S.spin=Math.min(100,S.spin+(perf?5:2.5)); perf?S.perfect++:S.good++;
    S.judg={t:'착!'+(perf?'':''),c:perf?'#FFE27A':'#FFFFFF',k:1,lane,label:perf?'딱 맞음':'좋아요'};
    noise(.05,{freq:perf?3000:2200,vol:.45}); tone(perf?700:520,.06,{type:'square',vol:.06}); }
  else { S.spin-=2; S.combo=0; noise(.04,{freq:1200,vol:.15}); }
  hud();
}
function finish(fell){ S.phase=fell?'fell':'done'; const total=S.chart.notes.length, acc=Math.round((S.perfect+S.good*.5)/total*100);
  const grade=fell?'':acc>=90?'명인':acc>=75?'상쇠':acc>=55?'잽이':'풋내기';
  if(S.score>(+store.get('paengi-best')||0)) store.set('paengi-best',S.score);
  M.show(fell?'팽이가 쓰러졌다':`${grade}!`, `점수 ${S.score} · 정확도 ${acc}% · 최대 ${S.maxCombo} 연속`);
  $('start').hidden=false; $('start').textContent='다시 치기'; hud(); }
K.on($('start'),'click',start);
['L','R'].forEach(l=>K.on($(l),'pointerdown',e=>{e.preventDefault();hit(l);}));
K.on(cv,'pointerdown',e=>{e.preventDefault(); const p=ptr(e,cv); hit(p.x<C.W/2?'L':'R');});
K.on(window,'keydown',e=>{ if(e.repeat) return; if(e.code==='KeyF'||e.code==='ArrowLeft'){e.preventDefault();hit('L');} if(e.code==='KeyJ'||e.code==='ArrowRight'){e.preventDefault();hit('R');}
  if(e.code==='Space'&&S.phase!=='play'&&!(document.activeElement instanceof HTMLButtonElement)){e.preventDefault();start();} });
let seed=5; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647; const scratches=[...Array(26)].map(()=>[rnd(),rnd(),rnd(),rnd()]);
K.loop(dt=>{
  const W=C.W,H=C.H, cx=W/2, cy=H*.5, hitDX=W*.24;
  if(S.phase==='play'){
    const t=now()-S.t0, ch=S.chart;
    while(S.schedI<ch.beats.length && ch.beats[S.schedI].t<t+.15){ const b=ch.beats[S.schedI]; if(b.t>t-.05) janggu(S.t0+b.t,b.down); S.schedI++; }
    for(const n of ch.notes){ if(n.hit===null && t-n.t>GOOD){ n.hit=0; S.combo=0; S.miss++; S.spin-=7; S.judg={t:'놓침',c:'#FFB4A8',k:1,lane:n.lane,label:''}; hud(); } }
    const cs=ch.notes.filter(n=>n.t<=t+.5).pop(); const secI=cs?cs.si:0; if(secI!==S.secI){S.secI=secI; $('sec').textContent=SONG[secI].name;}
    S.spin-=dt*1.6; hud();
    if(S.spin<=0){ S.spin=0; finish(true); }
    else if(t>ch.len+.6) finish(false);
  }
  if(S.phase==='fell') S.fallA=Math.min(1,S.fallA+dt*2);
  const spinK=S.phase==='ready'?.6:clamp(S.spin/100,0,1); S.ang+=dt*(4+spinK*26)*(S.phase==='fell'?1-S.fallA:1);
  ['L','R'].forEach(l=>S.whip[l]=Math.max(0,S.whip[l]-dt*5)); if(S.judg) S.judg.k-=dt*1.6;
  // 얼음판
  let g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#CFE3EE'); g.addColorStop(1,'#9EC4D8'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=1; scratches.forEach(([a,b,c,d])=>{ctx.beginPath();ctx.moveTo(a*W,b*H);ctx.lineTo(a*W+(c-.5)*W*.3,b*H+(d-.5)*H*.08);ctx.stroke();});
  ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([4,8]); ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,H*.3); ctx.moveTo(cx,H*.72); ctx.lineTo(cx,H); ctx.stroke(); ctx.setLineDash([]);
  // 레인과 고리
  ctx.strokeStyle='rgba(40,70,90,.18)'; ctx.lineWidth=W*.11; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke();
  [-1,1].forEach(s=>{ const x=cx+s*hitDX; ctx.strokeStyle='rgba(30,60,80,.75)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,cy,W*.055,0,7); ctx.stroke(); });
  // 음표
  if(S.chart){ const t=now()-S.t0;
    for(const n of S.chart.notes){ if(n.hit) continue; const dtn=n.t-t; if(dtn>TRAVEL||dtn<-GOOD) continue; const s=n.lane==='L'?-1:1;
      const hx=cx+s*hitDX, x=hx+s*(dtn/TRAVEL)*(W/2-hitDX+W*.08);
      ctx.fillStyle=n.lane==='L'?'#C8323A':'#2E6E62'; ctx.globalAlpha=n.hit===0?.3:1; ctx.beginPath(); ctx.arc(x,cy,W*.042,0,7); ctx.fill();
      ctx.fillStyle='rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(x-W*.012,cy-W*.014,W*.013,0,7); ctx.fill(); ctx.globalAlpha=1; } }
  // 팽이
  const fall=S.fallA, wob=(1-spinK)*.25+.02, tilt=Math.sin(S.ang*.35)*wob+fall*1.2, ty=cy+H*.02;
  ctx.save(); ctx.translate(cx,ty); ctx.rotate(tilt);
  ctx.fillStyle='rgba(30,50,60,.25)'; ctx.beginPath(); ctx.ellipse(0,H*.13,W*.12,W*.03,0,0,7); ctx.fill();
  const tw=W*.15, th=H*.16;
  ctx.fillStyle='#8B5A2B'; ctx.beginPath(); ctx.moveTo(-tw,-th*.15); ctx.lineTo(tw,-th*.15); ctx.lineTo(W*.008,th*.8); ctx.lineTo(-W*.008,th*.8); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(60,30,10,.4)'; ctx.lineWidth=1.5; for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(-tw*(1-i*.25),-th*.15+th*.95*i*.25);ctx.lineTo(tw*(1-i*.25),-th*.15+th*.95*i*.25);ctx.stroke();}
  const cols=['#C8323A','#F2B90F','#2E6E62','#1F5FC8','#F4EEDF'];
  for(let i=0;i<10;i++){ const a0=S.ang+i*Math.PI/5; ctx.fillStyle=cols[i%5]; ctx.beginPath(); ctx.moveTo(0,-th*.15); ctx.ellipse(0,-th*.15,tw,tw*.32,0,a0,a0+Math.PI/5); ctx.closePath(); ctx.fill(); }
  ctx.strokeStyle='#5A3A1A'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(0,-th*.15,tw,tw*.32,0,0,7); ctx.stroke();
  ctx.fillStyle='#5A3A1A'; ctx.beginPath(); ctx.ellipse(0,-th*.15,tw*.12,tw*.05,0,0,7); ctx.fill();
  ctx.restore();
  // 채
  [-1,1].forEach(sd=>{ const k=S.whip[sd<0?'L':'R'], bx=cx+sd*W*.44, by=H*.95, len=H*.3;
    const rx=sd*.25, ry=-1, tx=cx+sd*W*.13-bx, ty2=ty-by, tl=Math.hypot(tx,ty2), hx=tx/tl, hy=ty2/tl;
    let dx=rx+(hx-rx)*k, dy=ry+(hy-ry)*k; const dl=Math.hypot(dx,dy); dx/=dl; dy/=dl;
    const ex=bx+dx*len, ey=by+dy*len;
    ctx.strokeStyle='#6B4A2E'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(ex,ey); ctx.stroke();
    ctx.strokeStyle='#F4EEDF'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(ex,ey);
    if(k>.05) ctx.quadraticCurveTo(ex+(cx-ex)*.4,ey-H*.04,cx+sd*W*.12,ty-H*.02); else ctx.quadraticCurveTo(ex+sd*W*.04,ey+H*.06,ex+sd*W*.02,ey+H*.13);
    ctx.stroke(); });
  if(S.judg&&S.judg.k>0){ const x=cx+(S.judg.lane==='L'?-1:1)*hitDX, y=cy-W*.12-(1-S.judg.k)*20; ctx.globalAlpha=Math.min(1,S.judg.k*1.5);
    ctx.font=`${Math.round(W*.075)}px Jua,sans-serif`; ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(20,40,55,.8)'; ctx.fillStyle=S.judg.c;
    ctx.strokeText(S.judg.t,x,y); ctx.fillText(S.judg.t,x,y);
    if(S.judg.label){ctx.font=`${Math.round(W*.035)}px "Gowun Dodum",sans-serif`; ctx.lineWidth=3; ctx.strokeText(S.judg.label,x,y+W*.05); ctx.fillText(S.judg.label,x,y+W*.05);} ctx.globalAlpha=1; }
});
hud(); M.show('얼음판 장단치기','장단이 빨라질수록 팽이도 신나요');
}};
